#  两条流水线放一个文件里：web 是这个仓库本来就有的东西（Vue 构建 + server 的
#  单元测试），android 是 mobile/ 下的 Capacitor 套壳。
#
#  两个 job 故意不串行、也不互相依赖：light 版的 APK 里**不打包** dist/，它运行时
#  直接去加载用户自己服务器上的页面，所以 Vue 构建不是出包的前置条件。等将来那版
#  打包资源的 flavor 做出来，才需要把 web 的产物喂给 android。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      #  这个仓库的锁文件是 pnpm 的。用 npm install 会绕开锁文件重新解析一遍
      #  依赖，CI 每天跑出来的版本都可能不一样 —— 要的是可复现，不是"能装上"。
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  android:
    name: android (debug apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      #  Capacitor 8 的 capacitor.build.gradle 把 source/targetCompatibility 钉在
      #  21，AGP 8.13 也要求 JDK 21。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      #  mobile/ 是一套独立的 npm 工程，不挂进根目录的 pnpm workspace：Capacitor
      #  的 CLI 要顺着 node_modules 走到 @capacitor/android 里的原生源码
      #  （capacitor.settings.gradle 直接引的就是那个路径），pnpm 的符号链接布局
      #  在这条路上历来容易出岔子。
      - name: install capacitor toolchain
        working-directory: mobile
        run: npm ci

      #  android/ 里有一批东西按模板自带的 .gitignore 不进版本库
      #  （assets/public、capacitor.config.json、capacitor-cordova-android-plugins/
      #  等等），全靠这一步生成 —— 少了它 Gradle 连 settings.gradle 都读不下去。
      - name: cap sync
        working-directory: mobile
        run: npx cap sync android

      - name: assembleDebug
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: funread-light-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
