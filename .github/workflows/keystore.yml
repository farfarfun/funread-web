name: Keystore

# 生成一个**固定的**签名密钥并提交进仓库。只需要跑一次。
#
# 为什么需要它：Gradle 的 debug 签名用 `~/.android/debug.keystore`，而 GitHub
# runner 每次都是干净机器，那个文件每跑一次重新生成一次。于是每个 Release 的
# APK 签名都不同，用户装了上一版再装下一版会直接
# `INSTALL_FAILED_UPDATE_INCOMPATIBLE`，只能先卸载 —— 而卸载会把设备 token 和
# 本机离线缓存一起带走。「从 Release 下载安装」这件事就只对第一次成立。
#
# 为什么把密钥提交进公开仓库，而不是放 repo secret：
#
# funread 是自托管软件，APK 走 GitHub Release 侧载，**不上应用商店**。这里的
# 签名只用来保证「同一个 app 能覆盖升级」，不承担「证明这个包来自官方」的职责
# —— 后者在侧载分发里本来就不成立（谁都能自己编一个）。密钥公开的代价因此是
# 零，而换来的是任何人 fork 之后都能直接出可升级的包，不用先去配 secret。
#
# **这也意味着：不要从不信任的来源安装 funread 的 APK。** 签名相同不代表来源
# 可信，README 里也写了这条。
#
# 真要上应用商店时，换成 repo secret 里的私有密钥，并把这个文件删掉。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 生成（已存在就跳过）
        run: |
          if [ -f release.keystore ]; then
            echo "release.keystore 已存在，不覆盖 —— 覆盖会让已经装了的人升不了级"
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias funread \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass funread -keypass funread \
            -dname "CN=funread, OU=farfarfun, O=farfarfun, L=-, ST=-, C=CN"
          keytool -list -v -keystore release.keystore -storepass funread | head -20

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release.keystore
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -F- <<'MSG'
          chore: 固定签名密钥，让 APK 能覆盖升级

          Gradle 的 debug 签名用 ~/.android/debug.keystore，而 CI runner 每次
          都是干净机器、那个文件每跑一次重新生成。结果是每个 Release 的 APK
          签名都不同，装了上一版再装下一版直接 INSTALL_FAILED_UPDATE_INCOMPATIBLE，
          只能卸载重装 —— 而卸载会把设备 token 和本机离线缓存一起带走。

          密钥公开提交是有意的：funread 自托管、APK 侧载、不上应用商店，签名
          只用来保证覆盖升级，不承担「证明来自官方」的职责 —— 那在侧载分发里
          本来也不成立。代价为零，换来 fork 之后不配 secret 就能出可升级的包。

          由 .github/workflows/keystore.yml 生成。

          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>
          MSG
          git push
