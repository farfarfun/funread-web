<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <title>funread light</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #16181d;
        --muted: #6b7280;
        --line: #e3e5ea;
        --accent: #2f6df6;
        --danger: #d93025;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c10;
          --card: #16181d;
          --text: #e9eaee;
          --muted: #9aa0ab;
          --line: #262a32;
          --accent: #5b8cff;
          --danger: #ff6b60;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 20px);
        font-family: -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 600;
      }

      .lede {
        margin: 0 0 24px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 13px 14px;
        font-size: 16px; /* 小于 16px 时 WebView 会在聚焦时自动放大页面 */
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      input:focus {
        border-color: var(--accent);
        outline: none;
      }

      button {
        width: 100%;
        padding: 13px 14px;
        font-family: inherit;
        font-size: 16px;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 10px;
      }

      button[disabled] {
        opacity: 0.6;
      }

      button.ghost {
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      }

      .hint {
        min-height: 20px;
        margin: 14px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
        white-space: pre-line;
      }

      .hint[data-tone="error"] {
        color: var(--danger);
      }

      .recent {
        margin-top: 28px;
      }

      .recent__title {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .recent__item {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        margin-bottom: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .recent__url {
        flex: 1;
        overflow: hidden;
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recent__drop {
        width: auto;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      footer {
        margin-top: auto;
        padding-top: 28px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>连接到你的 funread</h1>
    <p class="lede">
      funread light 不自带书库，它打开的是你自己那台服务器上的页面。
      填上 funread-web 的地址，比如 <code>http://192.168.1.10:8811</code>。
    </p>

    <form id="form" autocomplete="off">
      <label for="url">服务器地址</label>
      <!-- 不用 type="url"：浏览器会按"绝对 URL"校验，用户敲的
           `192.168.1.10:8811` 直接被拦在提交之前，下面那段自动补 http:// 的
           逻辑根本没机会跑。校验自己来，报错也能说人话。 -->
      <input
        id="url"
        name="url"
        type="text"
        inputmode="url"
        enterkeyhint="go"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        placeholder="http://192.168.1.10:8811"
      />
      <div class="actions">
        <button id="connect" type="submit">连接</button>
        <button id="cancel" type="button" class="ghost" hidden>返回当前服务器</button>
      </div>
      <p id="hint" class="hint" role="status" aria-live="polite"></p>
    </form>

    <section id="recent" class="recent" hidden>
      <p class="recent__title">用过的地址</p>
      <div id="recentList"></div>
    </section>

    <footer>
      连接后页面来自你的服务器，登录状态、离线缓存都和手机浏览器里打开一模一样。<br />
      想换一台服务器：在服务器的「我的」页点「切换服务器」，或者在首页按返回键。
    </footer>

    <script>
      /**
       * funread light 的启动页。
       *
       * 这一版刻意不打包 Web 资源：Capacitor 只带这一个本地页面，拿到用户填的
       * 服务器地址后整窗口跳过去（location.replace）。页面来源因此就是用户自己的
       * 服务器，/api 是同源请求，后端的 cookie 会话原样生效，后端一行都不用改。
       *
       * 为什么不用 Capacitor 的 server.url：那是构建期配置，写进 capacitor.config
       * 和原生工程里，运行时改不了 —— 而服务器地址恰恰是每个用户都不一样的。
       */
      (function () {
        var KEY_CURRENT = "funread.light.server";
        var KEY_RECENT = "funread.light.servers";
        var PROBE_TIMEOUT = 8000;

        var form = document.getElementById("form");
        var input = document.getElementById("url");
        var connectBtn = document.getElementById("connect");
        var cancelBtn = document.getElementById("cancel");
        var hint = document.getElementById("hint");
        var recentBox = document.getElementById("recent");
        var recentList = document.getElementById("recentList");

        //  带 setup=1 回来的是「改地址」，不能再自动跳走，否则永远回不到这一页。
        var setupMode = /[?&]setup=1\b/.test(location.search);

        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
          } catch (err) {
            return fallback;
          }
        }

        function write(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (err) {
            /* 隐私模式下写不进去也不该挡住连接 */
          }
        }

        function say(text, tone) {
          hint.textContent = text || "";
          if (tone) hint.setAttribute("data-tone", tone);
          else hint.removeAttribute("data-tone");
        }

        /**
         * 把人手敲的东西收拾成一个能用的地址。
         * 用户大多只会敲 `192.168.1.10:8811`，默认补 http:// —— 自建服务基本都是
         * 明文 HTTP，补 https 反而是错的。
         */
        function normalize(raw) {
          var text = (raw || "").trim();
          if (!text) return { error: "先填一个服务器地址。" };
          if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(text)) text = "http://" + text;

          var url;
          try {
            url = new URL(text);
          } catch (err) {
            return { error: "这个地址看不懂，正确的样子是 http://192.168.1.10:8811 。" };
          }
          if (url.protocol !== "http:" && url.protocol !== "https:") {
            return { error: "只支持 http:// 和 https:// 开头的地址。" };
          }
          if (!url.hostname) return { error: "地址里没有主机名，比如 192.168.1.10 或 read.example.com 。" };
          //  末尾斜杠统一掉，免得「用过的地址」里同一台服务器出现两条。
          var value = url.origin + url.pathname.replace(/\/+$/, "");
          return { value: value };
        }

        /**
         * 探活。跨源拿不到响应内容（服务器不会给我们发 CORS 头），所以用 no-cors：
         * 它读不出状态码，但「有没有人应答」这一件事是准的，而填错地址、服务器没开
         * 恰好就是这一类错误。
         */
        function probe(target) {
          var controller = typeof AbortController === "function" ? new AbortController() : null;
          var timer = setTimeout(function () {
            if (controller) controller.abort();
          }, PROBE_TIMEOUT);

          return fetch(target + "/", {
            method: "GET",
            mode: "no-cors",
            cache: "no-store",
            signal: controller ? controller.signal : undefined,
          })
            .then(function () {
              clearTimeout(timer);
              return true;
            })
            .catch(function (err) {
              clearTimeout(timer);
              throw err;
            });
        }

        function failureText(target, err) {
          var aborted = err && (err.name === "AbortError" || /abort/i.test(String(err.message || "")));
          var host = target;
          try {
            host = new URL(target).host;
          } catch (ignored) {
            /* 用原文兜底 */
          }
          if (aborted) {
            return (
              "连 " + host + " 超过 8 秒没反应。\n" +
              "多半是手机和服务器不在同一个网络里（比如手机还在用流量），或者地址里的 IP 已经变了。"
            );
          }
          return (
            "连不上 " + host + "。挨个看一眼：\n" +
            "· 服务器上的 funread-web 在跑吗\n" +
            "· 端口对吗（默认 8811，不是后端的 18811）\n" +
            "· 手机和服务器在同一个局域网 / 能走到同一个公网地址吗"
          );
        }

        function remember(target) {
          var list = read(KEY_RECENT, []);
          if (!Array.isArray(list)) list = [];
          list = list.filter(function (item) {
            return item !== target;
          });
          list.unshift(target);
          write(KEY_RECENT, list.slice(0, 5));
          write(KEY_CURRENT, target);
        }

        function go(target) {
          //  replace 而不是 assign：启动页不该留在历史里，否则用户在服务器首页
          //  按一次返回就莫名其妙回到了填地址的界面。要回来有专门的入口。
          location.replace(target + "/");
        }

        function connect(target, options) {
          var silent = options && options.silent;
          connectBtn.disabled = true;
          connectBtn.textContent = "连接中…";
          say(silent ? "正在连接 " + target + " …" : "正在确认 " + target + " 能不能连上…");

          probe(target)
            .then(function () {
              remember(target);
              say("连上了，正在打开…");
              go(target);
            })
            .catch(function (err) {
              connectBtn.disabled = false;
              connectBtn.textContent = "连接";
              input.value = target;
              say(failureText(target, err), "error");
              renderRecent();
            });
        }

        function renderRecent() {
          var list = read(KEY_RECENT, []);
          if (!Array.isArray(list) || !list.length) {
            recentBox.hidden = true;
            recentList.textContent = "";
            return;
          }
          recentBox.hidden = false;
          recentList.textContent = "";
          list.forEach(function (item) {
            var row = document.createElement("div");
            row.className = "recent__item";

            var link = document.createElement("button");
            link.type = "button";
            link.className = "recent__url";
            link.style.cssText = "background:transparent;color:inherit;text-align:left;padding:0;border:none";
            link.textContent = item;
            link.addEventListener("click", function () {
              input.value = item;
              connect(item);
            });

            var drop = document.createElement("button");
            drop.type = "button";
            drop.className = "recent__drop";
            drop.textContent = "删除";
            drop.addEventListener("click", function () {
              var next = read(KEY_RECENT, []).filter(function (one) {
                return one !== item;
              });
              write(KEY_RECENT, next);
              renderRecent();
            });

            row.appendChild(link);
            row.appendChild(drop);
            recentList.appendChild(row);
          });
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var result = normalize(input.value);
          if (result.error) {
            say(result.error, "error");
            return;
          }
          connect(result.value);
        });

        cancelBtn.addEventListener("click", function () {
          var current = read(KEY_CURRENT, "");
          if (current) go(current);
        });

        input.addEventListener("input", function () {
          if (hint.getAttribute("data-tone") === "error") say("");
        });

        var current = read(KEY_CURRENT, "");
        renderRecent();

        if (setupMode) {
          input.value = current || "";
          cancelBtn.hidden = !current;
          if (current) say("当前连的是 " + current + "。改完点「连接」。");
          //  自动聚焦会顶起软键盘挡住「用过的地址」，让用户自己点。
        } else if (current) {
          input.value = current;
          connect(current, { silent: true });
        }
      })();
    </script>
  </body>
</html>
